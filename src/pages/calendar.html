<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spotory — Календарь</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=7">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/reset.css">
    <link rel="stylesheet" href="../styles/tokens.css">
    <link rel="stylesheet" href="../styles/common.css">
    <link rel="stylesheet" href="../styles/calendar.css">
  </head>
  <body class="app">
      <header class="app-header">
        <a class="app-header__brand" href="./index.html">
          <img class="app-header__logo" src="../assets/logo.svg" width="32" height="32" alt="">
          <span class="app-header__name">Spotory</span>
        </a>
        <div class="app-header__main">
          <h1 class="app-header__page-title">Календарь</h1>
          <div class="app-header__actions">
            <button class="icon-button" type="button" aria-label="Поиск">
              <img class="icon-button__glyph" src="../assets/icons/search.svg" alt="">
            </button>
            <button class="icon-button" type="button" aria-label="Уведомления">
              <img class="icon-button__glyph" src="../assets/icons/bell.svg" alt="">
            </button>
          </div>
        </div>
      </header>

      <div class="app__body">
      <nav class="tab-bar">
        <a class="tab-bar__link" href="./index.html">
          <img class="tab-bar__icon" src="../assets/icons/feed.svg" alt="">
          Лента
        </a>
        <a class="tab-bar__link tab-bar__link--active" href="./calendar.html">
          <img class="tab-bar__icon" src="../assets/icons/calendar.svg" alt="">
          Календарь
        </a>
        <a class="tab-bar__link" href="./map.html">
          <img class="tab-bar__icon" src="../assets/icons/map.svg" alt="">
          Карта
        </a>
        <a class="tab-bar__link" href="./communities.html">
          <img class="tab-bar__icon" src="../assets/icons/communities.svg" alt="">
          Сообщества
        </a>
        <a class="tab-bar__link" href="./profile.html">
          <img class="tab-bar__icon" src="../assets/icons/profile.svg" alt="">
          Профиль
        </a>
      </nav>

      <main class="app__main">
        <div class="calendar-page">
          <section class="calendar-widget">
            <div class="calendar-widget__month">
              <span>Октябрь 2026</span>
            </div>
            <div class="calendar-widget__grid" id="calendar-grid"></div>
          </section>

          <section class="event-list">
            <h3 id="events-title" class="event-list__title">События</h3>
            <div class="event-list__items" id="event-list-items"></div>
          </section>
        </div>
      </main>
      </div>
    <script src="../scripts/pages/calendar.js" type="module"></script>
  </body>
</html>
